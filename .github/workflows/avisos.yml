name: Avisos diarios

# Lo normal es que lo ejecute Google Cloud Scheduler cada 5 minutos.
# Este flujo queda solo para lanzarlo a mano desde GitHub > Actions.
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Hacer ahora el aviso de emergencia de hoy (copia cuadrillas y avisa)"
        type: boolean
        default: false
      recordatorio:
        description: "Enviar ahora el recordatorio de mañana (solo informa)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/669734412138/locations/global/workloadIdentityPools/github/providers/github
          service_account: pizarra-avisos@pizarra-de-tareas-semanales.iam.gserviceaccount.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -r avisos/requirements.txt

      - run: python avisos/main.py ${{ inputs.forzar && '--forzar' || '' }} ${{ inputs.recordatorio && '--recordatorio' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
