name: Copiar clave de Telegram a Google (un solo uso)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/669734412138/locations/global/workloadIdentityPools/github/providers/github
          service_account: pizarra-avisos@pizarra-de-tareas-semanales.iam.gserviceaccount.com
      - run: pip install --quiet google-auth requests
      - name: Guardar la clave en Secret Manager (sin mostrarla)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import base64, os, google.auth, google.auth.transport.requests, requests
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(google.auth.transport.requests.Request())
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          r = requests.post(
              "https://secretmanager.googleapis.com/v1/projects/pizarra-de-tareas-semanales/secrets/TELEGRAM_BOT_TOKEN:addVersion",
              headers={"Authorization": f"Bearer {creds.token}"},
              json={"payload": {"data": base64.b64encode(token.encode()).decode()}})
          r.raise_for_status()
          print("Clave guardada en Google.")
          PY
